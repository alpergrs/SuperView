[package]
name = "sv-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
tiff = "0.10"
png = "0.18"
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }
kamadak-exif = "0.6"
walkdir = "2"
trash = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
rawler = "0.8"
rayon = "1"
little_exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fast_image_resize = "5"
webp = { version = "0.3", default-features = false }
psd = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
toml = "0.9"
tiff = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
