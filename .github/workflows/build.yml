name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # libjpeg-turbo uses NASM for its fast SIMD code paths.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p sv-app

      - uses: actions/upload-artifact@v4
        with:
          name: superview-windows
          path: target/release/superview.exe
          if-no-files-found: error

      # A tag such as v0.1.0 publishes the exe as a release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/superview.exe --title "SuperView $GITHUB_REF_NAME" --generate-notes
