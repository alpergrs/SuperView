name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # libjpeg-turbo uses NASM for its fast SIMD code paths.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p sv-app

      - uses: actions/upload-artifact@v4
        with:
          name: superview-windows
          path: target/release/superview.exe
          if-no-files-found: error

      # A push to main publishes the exe as a release, once per version: raise the
      # version in Cargo.toml to publish the next one.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already published"
          else
            gh release create "$version" target/release/superview.exe --target "$GITHUB_SHA" --title "SuperView $version" --generate-notes
          fi
