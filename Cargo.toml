[workspace]
resolver = "2"
members = ["crates/sv-core", "crates/sv-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image decoding is far too slow unoptimised, even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.sv-core]
opt-level = 2
